name: Native platform checks
permissions:
  contents: read
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Linux compiler dependencies
      if: runner.os == 'Linux'
      run: 'sudo apt-get update

        sudo apt-get install -y g++ g++-mingw-w64-x86-64 rustc cargo cmake ninja-build make

        '
    - name: macOS Bash dependency
      if: runner.os == 'macOS'
      run: 'brew install bash cmake ninja

        echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"

        '
    - name: Check native toolchains
      run: 'bash --version

        g++ --version

        python3 --version

        rustc --version

        '
    - name: Both languages and all supported source types
      run: "set -euo pipefail\nfixture=$(mktemp -d \"${TMPDIR:-/tmp}/ghostnet ci.XXXXXX\")\ntrap 'rm -rf -- \"$fixture\"\
        ' EXIT\nprintf 'int answer();\\n' > \"$fixture/helper.h\"\nprintf '#include \"helper.h\"\\nint answer(){return\
        \ 42;}\\n' > \"$fixture/helper.cc\"\nprintf '#include \"helper.h\"\\n#include <iostream>\\nint main(){std::cout<<\"\
        GHOSTNET_OK=\"<<answer();}\\n' > \"$fixture/main.cpp\"\nfor script in ban.sh ban-ru.sh; do\n    bash -n\
        \ \"$script\"\n    output=$(BAN_NO_ANIMATION=1 bash \"$script\" run --mode project --target native \"$fixture\"\
        )\n    [[ \"$output\" == *GHOSTNET_OK=42* ]]\ndone\nprefix=\"$fixture/installed\"\nbash tools/install.sh\
        \ --prefix \"$prefix\"\n\"$prefix/bin/ghostnet\" --version\n\"$prefix/bin/ghostnet-ru\" --help\n"
    - name: macOS launchers
      if: runner.os == 'macOS'
      run: 'bash tools/ban.command --help

        bash tools/ban-ru.command --help

        '
    - name: OS installer, local payload and verified release
      run: 'set -euo pipefail

        fixture=$(mktemp -d "${TMPDIR:-/tmp}/ghostnet bootstrap.XXXXXX")

        trap ''rm -rf -- "$fixture"'' EXIT

        export HOME="$fixture/home"

        mkdir -p "$HOME"

        printf ''# preserve settings\n'' > "$HOME/.bashrc"

        # /bin/bash exercises the original Bash 3.2 on macOS.

        /bin/bash tools/GHOSTNET-Install.sh --yes --no-launch --prefix "$fixture/local tools"

        /bin/bash tools/GHOSTNET-Install.sh --yes --no-launch --prefix "$fixture/local tools"

        [[ $(grep -c ''# GHOSTNET PATH'' "$HOME/.bashrc") == 1 ]]

        source "$HOME/.bashrc"

        [[ $(command -v ghostnet) -ef "$fixture/local tools/bin/ghostnet" ]]

        ghostnet --version | grep ''1.4.0''

        printf ''#include <iostream>\nint main(){std::cout<<"BOOTSTRAP_OK";}\n'' > "$fixture/main.cpp"

        ghostnet run --mode project --target native "$fixture" | grep BOOTSTRAP_OK

        # Test downloads/checksum against an already-published release.

        /bin/bash tools/GHOSTNET-Install.sh --yes --no-launch --prefix "$fixture/release tools" --version v1.1.1

        "$fixture/release tools/bin/ghostnet" --version | grep ''1.1.1''

        '
    - name: Project environment, watch, clean and shell help
      run: |
        python3 - <<'PYLIFECYCLE'
        import os, subprocess, tempfile, unittest, shutil, platform
        from pathlib import Path
        ROOT=Path.cwd()
        BASH=os.environ.get("GHOSTNET_TEST_BASH",shutil.which("bash"))
        class LifecycleTests(unittest.TestCase):
         def setUp(self):
          self.tmp=tempfile.TemporaryDirectory(prefix="ghostnet lifecycle "); self.p=Path(self.tmp.name).resolve()
          self.env=dict(os.environ, BAN_NO_ANIMATION="1", HOME=str(self.p/"home"), XDG_STATE_HOME=str(self.p/"state"), PIP_NO_INDEX="1", PIP_DISABLE_PIP_VERSION_CHECK="1")
         def tearDown(self): self.tmp.cleanup()
         def call(self, script, action, *args):
          return subprocess.run([BASH,str(ROOT/script),action,"--target","native",*args,str(self.p)],env=self.env,text=True,encoding="utf-8",capture_output=True,timeout=60)
         def test_doctor_reports_python_and_missing_environment_without_writing(self):
          (self.p/"app.py").write_text("print('ok')")
          (self.p/"requirements.txt").write_text("nonexistent_ghostnet_dependency_xyz==1.0\n")
          for s in ("ban.sh","ban-ru.sh"):
           r=self.call(s,"doctor"); self.assertNotEqual(r.returncode,0); self.assertIn("[DOCTOR]",r.stdout); self.assertIn("ghostnet setup",r.stdout+r.stderr); self.assertFalse((self.p/".venv").exists()); self.assertFalse((self.p/".ghostnet-build").exists())
         def test_setup_creates_reuses_venv_and_run_uses_it(self):
          (self.p/"requirements.txt").write_text("")
          (self.p/"app.py").write_text("import sys; print('VENV='+sys.prefix)")
          for s in ("ban.sh","ban-ru.sh"):
           r=self.call(s,"setup"); self.assertEqual(r.returncode,0,r.stdout+r.stderr)
           marker=self.p/".venv/keep"; marker.write_text("keep")
           r=self.call(s,"setup"); self.assertEqual(r.returncode,0,r.stdout+r.stderr); self.assertTrue(marker.exists())
           r=self.call(s,"run"); self.assertEqual(r.returncode,0,r.stdout+r.stderr); self.assertIn("VENV="+str(self.p/".venv"),r.stdout)
         def test_setup_reports_package_failure(self):
          (self.p/"app.py").write_text("print('ok')")
          (self.p/"requirements.txt").write_text("nonexistent_ghostnet_dependency_xyz==1.0\n")
          for s in ("ban.sh","ban-ru.sh"):
           r=self.call(s,"setup"); self.assertNotEqual(r.returncode,0); self.assertIn("[SETUP]",r.stdout+r.stderr); self.assertIn("requirements.txt",r.stdout+r.stderr)
         def test_setup_refuses_foreign_venv_folder(self):
          (self.p/"app.py").write_text("print('ok')"); (self.p/".venv").mkdir(); marker=self.p/".venv/keep"; marker.write_text("keep")
          for s in ("ban.sh","ban-ru.sh"):
           r=self.call(s,"setup"); self.assertNotEqual(r.returncode,0); self.assertIn(".venv",r.stdout+r.stderr); self.assertEqual(marker.read_text(),"keep")
         def test_doctor_detects_missing_package_in_existing_environment(self):
          (self.p/"app.py").write_text("print('ok')")
          (self.p/"requirements.txt").write_text("")
          r=self.call("ban.sh","setup"); self.assertEqual(r.returncode,0,r.stdout+r.stderr)
          (self.p/"requirements.txt").write_text("nonexistent_ghostnet_dependency_xyz==1.0\n")
          for script in ("ban.sh","ban-ru.sh"):
           r=self.call(script,"doctor"); self.assertNotEqual(r.returncode,0,r.stdout+r.stderr); self.assertIn("[MISSING]",r.stdout)
         def test_watch_restarts_after_source_change_and_ignores_venv(self):
          import time, signal
          self.env["PYTHONIOENCODING"]="ascii"
          app=self.p/"app.py"; app.write_text("from pathlib import Path; Path('seen-one').touch()")
          for script in ("ban.sh","ban-ru.sh"):
           (self.p/"seen-one").unlink(missing_ok=True); (self.p/"seen-two").unlink(missing_ok=True)
           app.write_text("from pathlib import Path; Path('seen-one').touch()")
           log=self.p/"watch.log"
           with log.open('w') as output:
            proc=subprocess.Popen([BASH,str(ROOT/script),'watch','--no-animation',str(self.p)],env=self.env,stdout=output,stderr=output,start_new_session=(os.name != "nt"))
            try:
             deadline=time.monotonic()+10
             while not (self.p/"seen-one").exists() and proc.poll() is None and time.monotonic()<deadline: time.sleep(.1)
             self.assertTrue((self.p/"seen-one").exists(),log.read_text(encoding="utf-8"))
             app.write_text("from pathlib import Path; Path('seen-two').touch()")
             deadline=time.monotonic()+10
             while not (self.p/"seen-two").exists() and proc.poll() is None and time.monotonic()<deadline: time.sleep(.1)
             self.assertTrue((self.p/"seen-two").exists(),log.read_text(encoding="utf-8"))
             time.sleep(.8); before=log.read_text(encoding="utf-8").count('[WATCH]')
             (self.p/".venv").mkdir(exist_ok=True); (self.p/".venv/ignored.py").write_text('bad python')
             time.sleep(.8); self.assertEqual(log.read_text(encoding="utf-8").count('[WATCH]'),before)
            finally:
             if proc.poll() is None:
              if os.name == 'nt': subprocess.run(['taskkill.exe','/PID',str(proc.pid),'/T','/F'],capture_output=True)
              else: os.killpg(proc.pid,signal.SIGTERM)
             proc.wait(timeout=5)
         def test_clean_removes_owned_binary_preserves_sources_venv_and_foreign_files(self):
          (self.p/"main.cpp").write_text('int main(){}')
          (self.p/".venv").mkdir(); (self.p/".venv/keep").write_text('keep')
          for script in ("ban.sh","ban-ru.sh"):
           r=self.call(script,"build"); self.assertEqual(r.returncode,0,r.stdout+r.stderr); self.assertTrue((self.p/("main.exe" if os.name == "nt" else "main")).exists())
           (self.p/".ghostnet-build").mkdir(exist_ok=True); (self.p/".ghostnet-build/foreign.txt").write_text('keep')
           r=self.call(script,"clean"); self.assertEqual(r.returncode,0,r.stdout+r.stderr); self.assertFalse((self.p/("main.exe" if os.name == "nt" else "main")).exists()); self.assertTrue((self.p/"main.cpp").exists()); self.assertEqual((self.p/".venv/keep").read_text(),'keep'); self.assertEqual((self.p/".ghostnet-build/foreign.txt").read_text(),'keep')
         def test_clean_preserves_modified_build_output(self):
          (self.p/"main.cpp").write_text('int main(){}')
          r=self.call("ban.sh","build"); self.assertEqual(r.returncode,0,r.stdout+r.stderr)
          (self.p/("main.exe" if os.name == "nt" else "main")).write_text('user replacement')
          r=self.call("ban.sh","clean"); self.assertEqual(r.returncode,0,r.stdout+r.stderr); self.assertEqual((self.p/("main.exe" if os.name == "nt" else "main")).read_text(),'user replacement')
         def test_failed_build_saves_command_versions_and_error_log(self):
          (self.p/"main.cpp").write_text('not valid C++')
          for script in ("ban.sh","ban-ru.sh"):
           r=self.call(script,"build"); self.assertNotEqual(r.returncode,0)
           reports=list((self.p/"state/ghostnet/reports").glob('error.*')); self.assertTrue(reports,r.stdout+r.stderr)
           text=reports[-1].read_text(); self.assertIn('g++',text); self.assertIn('main.cpp',text); self.assertIn('error:',text); self.assertIn('GHOSTNET 1.4.0',text); self.assertIn('[REPORT]',r.stdout+r.stderr)
         def test_setup_installs_local_wheel_and_run_imports_package(self):
          import zipfile
          wheel=self.p/'ghostnet_probe-1.0-py3-none-any.whl'
          with zipfile.ZipFile(wheel,'w') as z:
           z.writestr('ghostnet_probe/__init__.py','VALUE="DEPENDENCY_OK"')
           z.writestr('ghostnet_probe-1.0.dist-info/METADATA','Metadata-Version: 2.1\nName: ghostnet-probe\nVersion: 1.0\n')
           z.writestr('ghostnet_probe-1.0.dist-info/WHEEL','Wheel-Version: 1.0\nGenerator: test\nRoot-Is-Purelib: true\nTag: py3-none-any\n')
           z.writestr('ghostnet_probe-1.0.dist-info/RECORD','')
          (self.p/'requirements.txt').write_text(str(wheel))
          (self.p/'app.py').write_text('from ghostnet_probe import VALUE; print(VALUE)')
          for script in ('ban.sh','ban-ru.sh'):
           r=self.call(script,'setup'); self.assertEqual(r.returncode,0,r.stdout+r.stderr)
           r=self.call(script,'run'); self.assertEqual(r.returncode,0,r.stdout+r.stderr); self.assertIn('DEPENDENCY_OK',r.stdout)
         def test_doctor_checks_version_constraints_and_environment_markers(self):
          (self.p/'app.py').write_text('print("ok")'); (self.p/'requirements.txt').write_text('')
          r=self.call('ban.sh','setup'); self.assertEqual(r.returncode,0,r.stdout+r.stderr)
          for script in ('ban.sh','ban-ru.sh'):
           (self.p/'requirements.txt').write_text('pip==0.0.1\n')
           r=self.call(script,'doctor'); self.assertNotEqual(r.returncode,0,r.stdout+r.stderr); self.assertIn('[MISMATCH]',r.stdout)
           (self.p/'requirements.txt').write_text('nonexistent_ghostnet_dependency_xyz; python_version < "1.0"\n')
           r=self.call(script,'doctor'); self.assertEqual(r.returncode,0,r.stdout+r.stderr)
         def test_completion_output_and_installed_manual(self):
          for script in ('ban.sh','ban-ru.sh'):
           for shell in ('bash','zsh','powershell'):
            r=subprocess.run([BASH,str(ROOT/script),'completion',shell],capture_output=True,text=True,encoding="utf-8",env=self.env)
            self.assertEqual(r.returncode,0,r.stdout+r.stderr); self.assertNotIn('[SCAN',r.stdout); self.assertIn('doctor',r.stdout); self.assertIn('setup',r.stdout)
           r=subprocess.run([BASH,str(ROOT/script),'completion','bash'],capture_output=True,text=True,encoding="utf-8",env=self.env)
           completion=self.p/'completion.sh'; completion.write_text(r.stdout)
           r=subprocess.run([BASH,'-c','source "$1"; COMP_WORDS=(ghostnet do); COMP_CWORD=1; _ghostnet_complete; printf "%s\n" "${COMPREPLY[@]}"','completion',str(completion)],capture_output=True,text=True,encoding="utf-8",env=self.env)
           self.assertEqual(r.returncode,0,r.stdout+r.stderr); self.assertIn('doctor',r.stdout)
          prefix=self.p/'installed'
          r=subprocess.run([BASH,str(ROOT/'tools/install.sh'),'--prefix',str(prefix)],capture_output=True,text=True,encoding="utf-8",env=self.env)
          self.assertEqual(r.returncode,0,r.stdout+r.stderr); self.assertTrue((prefix/'share/man/man1/ghostnet.1').exists())
          self.assertTrue((prefix/'share/bash-completion/completions/ghostnet').exists())
         def test_setup_requirements_with_nested_python_sources(self):
          (self.p/'src').mkdir(); (self.p/'src/app.py').write_text('import sys; print("NESTED="+sys.prefix)')
          (self.p/'requirements.txt').write_text('')
          for script in ('ban.sh','ban-ru.sh'):
           r=self.call(script,'setup'); self.assertEqual(r.returncode,0,r.stdout+r.stderr); self.assertTrue((self.p/'.venv/pyvenv.cfg').exists())
           r=self.call(script,'run','--run-file','src/app.py'); self.assertEqual(r.returncode,0,r.stdout+r.stderr); self.assertIn('NESTED='+str(self.p/'.venv'),r.stdout)
         def test_doctor_rejects_broken_virtual_environment(self):
          (self.p/'app.py').write_text('print("ok")'); (self.p/'.venv').mkdir(); (self.p/'.venv/pyvenv.cfg').write_text('home = /missing')
          for script in ('ban.sh','ban-ru.sh'):
           r=self.call(script,'doctor'); self.assertNotEqual(r.returncode,0,r.stdout+r.stderr); self.assertIn('.venv',r.stdout+r.stderr)
         def test_clean_preserves_old_modified_output_after_different_build(self):
          (self.p/'main.cpp').write_text('int main(){}')
          for script in ('ban.sh','ban-ru.sh'):
           (self.p/'ghostnet.conf').write_text('builder=cpp\noutput=first\n')
           r=self.call(script,'build'); self.assertEqual(r.returncode,0,r.stdout+r.stderr)
           first=self.p/'.ghostnet-build'/('windows' if os.name=='nt' else ('macos' if platform.system()=='Darwin' else 'linux'))/('first.exe' if os.name=='nt' else 'first'); first.write_text('user replacement')
           (self.p/'ghostnet.conf').write_text('builder=cpp\noutput=second\n')
           r=self.call(script,'build'); self.assertEqual(r.returncode,0,r.stdout+r.stderr)
           r=self.call(script,'clean'); self.assertEqual(r.returncode,0,r.stdout+r.stderr); self.assertTrue(first.exists(),r.stdout+r.stderr); self.assertEqual(first.read_text(),'user replacement')
         @unittest.skipIf(os.name=='nt','Unix process group contract')
         def test_watch_stops_descendants_after_the_program_exits(self):
          import signal,time
          (self.p/'app.py').write_text("import subprocess,sys\nfrom pathlib import Path\np=subprocess.Popen([sys.executable,'-c','import signal,time; signal.signal(signal.SIGTERM,signal.SIG_IGN); time.sleep(90)'])\nPath('descendant.pid').write_text(str(p.pid))\n")
          def alive(pid):
           try:
            stat=Path('/proc')/str(pid)/'stat'
            if stat.exists() and stat.read_text().split()[2]=='Z': return False
            os.kill(pid,0); return True
           except ProcessLookupError: return False
          for script in ('ban.sh','ban-ru.sh'):
           marker=self.p/'descendant.pid'; marker.unlink(missing_ok=True); pid=None
           with (self.p/'orphan.log').open('w') as out:
            proc=subprocess.Popen([BASH,str(ROOT/script),'watch',str(self.p)],env=self.env,stdout=out,stderr=out,start_new_session=True)
            try:
             deadline=time.monotonic()+10
             while not marker.exists() and proc.poll() is None and time.monotonic()<deadline:time.sleep(.1)
             self.assertTrue(marker.exists(),(self.p/'orphan.log').read_text()); pid=int(marker.read_text()); time.sleep(.6)
             os.killpg(proc.pid,signal.SIGTERM); proc.wait(timeout=6)
             deadline=time.monotonic()+3
             while alive(pid) and time.monotonic()<deadline: time.sleep(.1)
             self.assertFalse(alive(pid),'watch left its program descendant running')
            finally:
             if proc.poll() is None: os.killpg(proc.pid,signal.SIGKILL);proc.wait()
             if pid and alive(pid): os.kill(pid,signal.SIGKILL)
         @unittest.skipIf(os.name=='nt','Unix directory alias contract')
         def test_clean_handles_project_directory_alias(self):
          (self.p/'main.cpp').write_text('int main(){}'); alias=self.p/'alias'; alias.symlink_to(self.p,target_is_directory=True)
          for script in ('ban.sh','ban-ru.sh'):
           for action in ('build','clean'):
            r=subprocess.run([BASH,str(ROOT/script),action,'--target','native',str(alias)],env=self.env,text=True,encoding="utf-8",capture_output=True,timeout=30)
            self.assertEqual(r.returncode,0,r.stdout+r.stderr)
           self.assertFalse((self.p/'main').exists()); self.assertTrue((self.p/'main.cpp').exists())
         @unittest.skipIf(os.name=='nt' or platform.system()=='Darwin','Linux cross target contract')
         def test_watch_rejects_cross_target_before_build(self):
          import signal
          (self.p/'main.cpp').write_text('int main(){}')
          for script in ('ban.sh','ban-ru.sh'):
           proc=subprocess.Popen([BASH,str(ROOT/script),'watch','--target','windows',str(self.p)],env=self.env,stdout=subprocess.PIPE,stderr=subprocess.PIPE,text=True,encoding="utf-8",start_new_session=True)
           try:
            try: out,err=proc.communicate(timeout=3)
            except subprocess.TimeoutExpired: self.fail('watch ignored the requested cross target and started a native build')
            self.assertNotEqual(proc.returncode,0,out+err); self.assertIn('native',out+err); self.assertFalse((self.p/'main').exists())
           finally:
            if proc.poll() is None: os.killpg(proc.pid,signal.SIGTERM); proc.communicate(timeout=5)
        if __name__=="__main__": unittest.main()
        PYLIFECYCLE
    - name: Verified updater failure and atomic activation contracts
      if: runner.os == 'Linux'
      run: |
        python3 - <<'PYUPDATES'
        import hashlib,json,os,pathlib,subprocess,tempfile,unittest,zipfile
        ROOT=pathlib.Path.cwd()
        class Updates(unittest.TestCase):
         def setUp(self):
          self.tmp=tempfile.TemporaryDirectory(prefix='ghostnet update ');self.p=pathlib.Path(self.tmp.name);self.prefix=self.p/'installed';self.share=self.prefix/'share/ghostnet';self.share.mkdir(parents=True)
          (self.share/'install-mode').write_text('installer');(self.share/'ban.sh').write_text('OLD');(self.share/'ban-ru.sh').write_text('OLD_RU')
          self.mocks=self.p/'mocks';self.mocks.mkdir();self.archive=self.p/'ghostnet-linux.zip'
          with zipfile.ZipFile(self.archive,'w') as z:
           for name,data in [('ban.sh','#!/bin/bash\necho NEW'),('ban-ru.sh','#!/bin/bash\necho NEW_RU'),('ghostnet','#!/bin/bash'),('ghostnet-ru','#!/bin/bash'),('install.sh','#!/bin/bash'),('ghostnet-update.py','# updated helper')]:z.writestr('GHOSTNET/'+name,data)
          self.sums=self.p/'SHA256SUMS';self.sums.write_text(hashlib.sha256(self.archive.read_bytes()).hexdigest()+'  ghostnet-linux.zip\n')
          (self.mocks/'curl').write_text('''#!/usr/bin/env python3
        import os,sys,shutil
        args=sys.argv[1:]
        if '--head' in args:print('https://github.com/galvatrone/CPP-Builder-Gostnet-/releases/tag/v9.0.0',end='');sys.exit(0)
        name='SHA256SUMS' if args[args.index('--output')-1].endswith('SHA256SUMS') else 'ghostnet-linux.zip'
        shutil.copyfile(os.environ['FIXTURE']+'/'+name,args[args.index('--output')+1])
        ''');(self.mocks/'curl').chmod(0o755)
          (self.mocks/'systemctl').write_text('#!/bin/bash\nexit 0\n');(self.mocks/'systemctl').chmod(0o755)
          self.env=dict(os.environ,HOME=str(self.p/'home'),XDG_STATE_HOME=str(self.p/'state'),XDG_CONFIG_HOME=str(self.p/'home/.config'),FIXTURE=str(self.p),PATH=str(self.mocks)+':'+os.environ['PATH'])
         def tearDown(self):self.tmp.cleanup()
         def call(self,*args):return subprocess.run(['python3',str(ROOT/'tools/ghostnet-update.py'),'--root',str(self.prefix),*args],env=self.env,text=True,encoding="utf-8",capture_output=True,timeout=20)
         def test_verified_update_switches_complete_payload(self):
          r=self.call('update');self.assertEqual(r.returncode,0,r.stdout+r.stderr)
          state=json.loads((self.share/'active.json').read_text());payload=pathlib.Path(state['Payload']);self.assertEqual((payload/'ban.sh').read_text(),'#!/bin/bash\necho NEW');self.assertEqual(state['Version'],'v9.0.0');self.assertEqual((self.share/'ban.sh').read_text(),'OLD')
         def test_bad_checksum_keeps_previous_payload(self):
          self.sums.write_text('0'*64+'  ghostnet-linux.zip\n');r=self.call('update');self.assertNotEqual(r.returncode,0);self.assertFalse((self.share/'active.json').exists());self.assertEqual((self.share/'ban.sh').read_text(),'OLD')
         def test_unsafe_archive_rejected_even_with_valid_checksum(self):
          with zipfile.ZipFile(self.archive,'a') as z:z.writestr('GHOSTNET/../escape','BAD')
          self.sums.write_text(hashlib.sha256(self.archive.read_bytes()).hexdigest()+'  ghostnet-linux.zip\n');r=self.call('update');self.assertNotEqual(r.returncode,0);self.assertFalse((self.share/'active.json').exists());self.assertFalse((self.prefix/'escape').exists())
         def test_offline_startup_never_prevents_work(self):
          (self.mocks/'curl').write_text('#!/bin/bash\nexit 7\n');r=self.call('--startup');self.assertEqual(r.returncode,0,r.stdout+r.stderr);self.assertFalse((self.share/'active.json').exists())
         def test_package_owned_install_never_replaces_payload(self):
          (self.share/'install-mode').write_text('aur');r=self.call('--background');self.assertEqual(r.returncode,0,r.stdout+r.stderr);self.assertFalse((self.share/'active.json').exists());self.assertEqual((self.share/'ban.sh').read_text(),'OLD')

         def test_installed_command_uses_activated_payload(self):
          r=subprocess.run(['bash',str(ROOT/'tools/install.sh'),'--prefix',str(self.prefix)],env=self.env,capture_output=True,text=True)
