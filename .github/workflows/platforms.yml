name: Native platform checks
permissions:
  contents: read
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - name: Linux compiler dependencies
      if: runner.os == 'Linux'
      run: 'sudo apt-get update

        sudo apt-get install -y g++ g++-mingw-w64-x86-64 rustc cargo cmake ninja-build make

        '
    - name: macOS Bash dependency
      if: runner.os == 'macOS'
      run: 'brew install bash cmake ninja

        echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"

        '
    - name: Check native toolchains
      run: 'bash --version

        g++ --version

        python3 --version

        rustc --version

        '
    - name: Both languages and all supported source types
      run: "set -euo pipefail\nfixture=$(mktemp -d \"${TMPDIR:-/tmp}/ghostnet ci.XXXXXX\")\ntrap 'rm -rf -- \"$fixture\"\
        ' EXIT\nprintf 'int answer();\\n' > \"$fixture/helper.h\"\nprintf '#include \"helper.h\"\\nint answer(){return\
        \ 42;}\\n' > \"$fixture/helper.cc\"\nprintf '#include \"helper.h\"\\n#include <iostream>\\nint main(){std::cout<<\"\
        GHOSTNET_OK=\"<<answer();}\\n' > \"$fixture/main.cpp\"\nfor script in ban.sh ban-ru.sh; do\n    bash -n\
        \ \"$script\"\n    output=$(BAN_NO_ANIMATION=1 bash \"$script\" run --mode project --target native \"$fixture\"\
        )\n    [[ \"$output\" == *GHOSTNET_OK=42* ]]\ndone\nprefix=\"$fixture/installed\"\nbash tools/install.sh\
        \ --prefix \"$prefix\"\n\"$prefix/bin/ghostnet\" --version\n\"$prefix/bin/ghostnet-ru\" --help\n"
    - name: macOS launchers
      if: runner.os == 'macOS'
      run: 'bash tools/ban.command --help

        bash tools/ban-ru.command --help

        '
    - name: OS installer, local payload and verified release
      run: 'set -euo pipefail

        fixture=$(mktemp -d "${TMPDIR:-/tmp}/ghostnet bootstrap.XXXXXX")

        trap ''rm -rf -- "$fixture"'' EXIT

        export HOME="$fixture/home"

        mkdir -p "$HOME"

        printf ''# preserve settings\n'' > "$HOME/.bashrc"

        # /bin/bash exercises the original Bash 3.2 on macOS.

        /bin/bash tools/GHOSTNET-Install.sh --yes --no-launch --prefix "$fixture/local tools"

        /bin/bash tools/GHOSTNET-Install.sh --yes --no-launch --prefix "$fixture/local tools"

        [[ $(grep -c ''# GHOSTNET PATH'' "$HOME/.bashrc") == 1 ]]

        source "$HOME/.bashrc"

        [[ $(command -v ghostnet) -ef "$fixture/local tools/bin/ghostnet" ]]

        ghostnet --version | grep ''1.3.0''

        printf ''#include <iostream>\nint main(){std::cout<<"BOOTSTRAP_OK";}\n'' > "$fixture/main.cpp"

        ghostnet run --mode project --target native "$fixture" | grep BOOTSTRAP_OK

        # Test downloads/checksum against an already-published release.

        /bin/bash tools/GHOSTNET-Install.sh --yes --no-launch --prefix "$fixture/release tools" --version v1.1.1

        "$fixture/release tools/bin/ghostnet" --version | grep ''1.1.1''

        '
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-rust mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja make
    - name: Check native toolchains
      shell: msys2 {0}
      run: 'bash --version

        g++ --version

        python --version

        rustc --version

        '
    - name: Both languages and all supported source types
      shell: msys2 {0}
      run: "set -euo pipefail\nfixture=$(mktemp -d \"${TMPDIR:-/tmp}/ghostnet ci.XXXXXX\")\ntrap 'rm -rf -- \"$fixture\"\
        ' EXIT\nprintf 'int answer();\\n' > \"$fixture/helper.h\"\nprintf '#include \"helper.h\"\\nint answer(){return\
        \ 42;}\\n' > \"$fixture/helper.cc\"\nprintf '#include \"helper.h\"\\n#include <iostream>\\nint main(){std::cout<<\"\
        GHOSTNET_OK=\"<<answer();}\\n' > \"$fixture/main.cpp\"\nfor script in ban.sh ban-ru.sh; do\n    bash -n\
        \ \"$script\"\n    output=$(BAN_NO_ANIMATION=1 bash \"$script\" run --mode project --target native \"$fixture\"\
        )\n    [[ \"$output\" == *GHOSTNET_OK=42* ]]\ndone\nprefix=\"$fixture/installed\"\nbash tools/install.sh\
        \ --prefix \"$prefix\"\n\"$prefix/bin/ghostnet\" --version\n\"$prefix/bin/ghostnet-ru\" --help\n"
    - name: Windows launchers
      shell: msys2 {0}
      run: 'export MSYS2_ROOT="$(cygpath -w /)"

        cmd.exe //c tools\\ban.cmd --help

        cmd.exe //c tools\\ban-ru.cmd --help

        '
  native-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      MSYS2_ROOT: C:\ghostnet-test-msys64
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Verify checksums and staged update behavior
      shell: powershell
      run: "$ErrorActionPreference = 'Stop'\n$Installer = Join-Path (Get-Location) 'tools/GHOSTNET-Install.cmd'\n\
        if (!(Test-Path -LiteralPath $Installer)) { throw 'GHOSTNET-Install.cmd is missing' }\n$Text = Get-Content\
        \ -LiteralPath $Installer -Raw\n$Body = ($Text -split '(?m)^# GHOSTNET POWERSHELL START\\r?$',2)[1]\n$Tokens=$null;\
        \ $Errors=$null\n$Ast=[System.Management.Automation.Language.Parser]::ParseInput($Body,[ref]$Tokens,[ref]$Errors)\n\
        if ($Errors.Count) { throw ($Errors | Out-String) }\n$Ast.FindAll({param($Node) $Node -is [System.Management.Automation.Language.FunctionDefinitionAst]},$false)\
        \ | ForEach-Object { . ([scriptblock]::Create($_.Extent.Text)) }\n$Fixture=Join-Path ([IO.Path]::GetTempPath())\
        \ ('ghostnet-core-'+[guid]::NewGuid())\nNew-Item -ItemType Directory -Path $Fixture | Out-Null\nfunction\
        \ Assert($Condition,$Message) { if (!$Condition) { throw $Message } }\ntry {\n    $Payload=Join-Path $Fixture\
        \ 'payload'; New-Item -ItemType Directory -Path (Join-Path $Payload 'GHOSTNET') | Out-Null\n    foreach\
        \ ($Name in 'ban.sh','ban-ru.sh') { Set-Content -LiteralPath (Join-Path $Payload \"GHOSTNET/$Name\") -Value\
        \ '#!/bin/bash' }\n    $Zip=Join-Path $Fixture 'ghostnet-windows.zip'\n    Compress-Archive -LiteralPath\
        \ (Join-Path $Payload 'GHOSTNET') -DestinationPath $Zip\n    $Hash=(Get-FileHash -LiteralPath $Zip -Algorithm\
        \ SHA256).Hash.ToLower()\n    $Sums=Join-Path $Fixture 'SHA256SUMS'; Set-Content -LiteralPath $Sums -Value\
        \ \"$Hash  ghostnet-windows.zip\"\n    $Root=Join-Path $Fixture 'installed'; New-Item -ItemType Directory\
        \ -Path $Root | Out-Null\n    $State=Join-Path $Root 'installation.json'; Set-Content -LiteralPath $State\
        \ -Value '{\"Version\":\"old\"}'\n    $Before=[IO.File]::ReadAllBytes($State)\n    Set-Content -LiteralPath\
        \ $Sums -Value (('0'*64)+'  ghostnet-windows.zip')\n    $Rejected=$false\n    try { Install-Payload $Zip\
        \ $Sums 'v1.1.0' $Root | Out-Null } catch { $Rejected=$true }\n    Assert $Rejected 'Corrupt archive was\
        \ accepted'\n    Assert ([Convert]::ToBase64String([IO.File]::ReadAllBytes($State)) -eq [Convert]::ToBase64String($Before))\
        \ 'Bad checksum changed active installation'\n    Set-Content -LiteralPath $Sums -Value \"$Hash  ghostnet-windows.zip\"\
        \n    $Installed=Install-Payload $Zip $Sums 'v1.1.0' $Root\n    Assert (Test-Path -LiteralPath (Join-Path\
        \ $Installed 'ban.sh')) 'Verified archive not installed'\n    Assert ((Get-Content -LiteralPath $State -Raw)\
        \ -match 'old') 'Staging activated a version prematurely'\n    # Reject traversal before extraction, even\
        \ when checksum is valid.\n    Add-Type -AssemblyName System.IO.Compression.FileSystem\n    $Bad=Join-Path\
        \ $Fixture 'bad.zip'\n    $Archive=[IO.Compression.ZipFile]::Open($Bad,[IO.Compression.ZipArchiveMode]::Create)\n\
        \    $Entry=$Archive.CreateEntry('../escaped.txt');$Writer=New-Object IO.StreamWriter($Entry.Open());$Writer.Write('bad');$Writer.Dispose();$Archive.Dispose()\n\
        \    $BadHash=(Get-FileHash -LiteralPath $Bad -Algorithm SHA256).Hash\n    Set-Content -LiteralPath $Sums\
        \ -Value \"$BadHash  ghostnet-windows.zip\"\n    $Rejected=$false\n    try { Install-Payload $Bad $Sums\
        \ 'v1.1.1' $Root | Out-Null } catch { $Rejected=$true }\n    Assert $Rejected 'Traversal ZIP was accepted'\n\
        \    Assert (!(Test-Path -LiteralPath (Join-Path $Root 'escaped.txt'))) 'ZIP wrote outside payload'\n  \
        \  Write-ActiveState $Root 'v1.1.0' $Installed 'C:\\msys64'\n    Write-ActiveState $Root 'v1.1.1' $Installed\
        \ 'C:\\msys64'\n    Assert ((Get-Content -LiteralPath $State -Raw | ConvertFrom-Json).Version -eq 'v1.1.1')\
        \ 'Repeated state replacement failed'\n    Write-Host 'PASS: checksum verification, staged payload, previous\
        \ installation preservation and ZIP validation'\n} finally { Remove-Item -LiteralPath $Fixture -Recurse\
        \ -Force }\n"
    - name: Install with fresh MSYS2 and exercise commands
      shell: powershell
      run: "$ErrorActionPreference = 'Stop'\n$Repo = (Get-Location).Path\n$Installer = Join-Path $Repo 'tools/GHOSTNET-Install.cmd'\n\
        if (!(Test-Path -LiteralPath $Installer)) { throw 'GHOSTNET-Install.cmd is missing' }\n$TestRoot = Join-Path\
        \ $env:TEMP ('ghostnet native test ' + [guid]::NewGuid())\n$App = Join-Path $TestRoot 'installed application'\n\
        $OriginalPath = [Environment]::GetEnvironmentVariable('Path','User')\nNew-Item -ItemType Directory -Path\
        \ $TestRoot | Out-Null\nfunction Assert($Condition,$Message) { if (!$Condition) { throw $Message } }\ntry\
        \ {\n    # Exercise single-file bootstrap against a real already-published release.\n    & $Installer --yes\
        \ --no-launch --version v1.1.0 --dir $App --msys2-root $env:MSYS2_ROOT\n    Assert ($LASTEXITCODE -eq 0)\
        \ 'Native installer failed'\n    $Command = Join-Path $App 'bin\\ghostnet.cmd'\n    $RuCommand = Join-Path\
        \ $App 'bin\\ghostnet-ru.cmd'\n    $Output = & $Command --version\n    Assert ($LASTEXITCODE -eq 0 -and\
        \ \"$Output\" -match '1.1.0') 'Installed command failed'\n    $UserPath = [Environment]::GetEnvironmentVariable('Path','User')\n\
        \    $ExpectedBin=[IO.Path]::GetFullPath((Join-Path $App 'bin')).TrimEnd('\\')\n    Write-Host ('Expected\
        \ user PATH entry: '+$ExpectedBin)\n    Write-Host ('Actual user PATH: '+$UserPath)\n    $HasBin=@($UserPath.Split(';')\
        \ | Where-Object { $_.TrimEnd('\\') -ieq $ExpectedBin }).Count -gt 0\n    Assert $HasBin 'User PATH was\
        \ not updated'\n    foreach ($Part in $OriginalPath.Split(';')) {\n        if ($Part) { Assert ($UserPath.Split(';')\
        \ -contains $Part) 'Existing PATH entry lost' }\n    }\n    # Cwd and quoting: build/run outside repository,\
        \ path and selected source contain spaces.\n    $Project = Join-Path $TestRoot 'project with spaces'\n \
        \   New-Item -ItemType Directory -Path $Project | Out-Null\n    Set-Content -LiteralPath (Join-Path $Project\
        \ 'hello world.cpp') -Value '#include <iostream>\nint main(){std::cout << \"NATIVE_CMD_OK\";}' -Encoding\
        \ ASCII\n    Push-Location $Project\n    try {\n        $Output = & $Command run --mode project --target\
        \ native .\n        Assert ($LASTEXITCODE -eq 0 -and \"$Output\" -match 'NATIVE_CMD_OK') 'PowerShell command\
        \ or cwd forwarding failed'\n        $Output = & $env:ComSpec /d /c ('\"' + $RuCommand + '\" --auto --mode\
        \ project --target native --run .')\n        Assert ($LASTEXITCODE -eq 0 -and \"$Output\" -match 'NATIVE_CMD_OK')\
        \ 'CMD bridge failed'\n    } finally { Pop-Location }\n    & $Installer --yes --no-launch --version v1.1.0\
        \ --dir $App --msys2-root $env:MSYS2_ROOT\n    Assert ($LASTEXITCODE -eq 0) 'Reinstall failed'\n    Assert\
        \ ([Environment]::GetEnvironmentVariable('Path','User') -eq $UserPath) 'Reinstall duplicated PATH'\n   \
        \ # Update is a real request for the latest stable release, never main.\n    # Exercise the current updater\
        \ rather than the historical installer copied from v1.1.0.\n    Copy-Item -LiteralPath $Installer -Destination\
        \ (Join-Path $App 'GHOSTNET-Install.cmd') -Force\n    & $Command update --yes --no-launch\n    Assert ($LASTEXITCODE\
        \ -eq 0) 'Release updater failed'\n    & $Command --help | Out-Null\n    Assert ($LASTEXITCODE -eq 0) 'Updated\
        \ command failed'\n    Write-Host 'PASS: single-file install, native cmd/PowerShell commands, cwd, PATH\
        \ and update'\n} finally {\n    [Environment]::SetEnvironmentVariable('Path',$OriginalPath,'User')\n   \
        \ Remove-Item -LiteralPath $TestRoot -Recurse -Force -ErrorAction SilentlyContinue\n}\n"
  languages:
    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - macos-latest
        - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'
    - uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: false
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
        package-manager-cache: false
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - uses: dart-lang/setup-dart@v1
    - uses: gradle/actions/setup-gradle@v5
      if: runner.os == 'Linux'
      with:
        gradle-version: 9.1.0
        cache-disabled: true
    - name: Linux optional runtimes
      if: runner.os == 'Linux'
      run: 'sudo apt-get update

        sudo apt-get install -y ruby php-cli lua5.4

        '
    - name: macOS Bash
      if: runner.os == 'macOS'
      run: 'brew install bash

        echo "$(brew --prefix bash)/bin" >> "$GITHUB_PATH"

        '
    - uses: msys2/setup-msys2@v2
      if: runner.os == 'Windows'
      with:
        msystem: UCRT64
        update: true
        path-type: inherit
        install: mingw-w64-ucrt-x86_64-gcc
    - name: Verified Kotlin, Zig and TypeScript SDKs
      shell: bash
      run: "python3 - <<'PYSDK'\nimport hashlib, json, os, pathlib, platform, tarfile, urllib.request, zipfile\n\
        root=pathlib.Path(os.environ['RUNNER_TEMP'])/'ghostnet-sdk';root.mkdir(exist_ok=True)\ndef fetch(url,path):\n\
        \ with urllib.request.urlopen(url,timeout=90) as response:path.write_bytes(response.read())\nfetch('https://ziglang.org/download/index.json',root/'zig-index.json')\n\
        arch='aarch64' if platform.machine().lower() in ('arm64','aarch64') else 'x86_64'\nhost={'Darwin':'macos','Windows':'windows','Linux':'linux'}[platform.system()]\n\
        item=json.loads((root/'zig-index.json').read_text())['0.17.0'][arch+'-'+host]\narchive=root/('zig.zip' if\
        \ host=='windows' else 'zig.tar.xz');fetch(item['tarball'],archive)\nassert hashlib.sha256(archive.read_bytes()).hexdigest()==item['shasum']\n\
        if host=='windows':\n with zipfile.ZipFile(archive) as z:z.extractall(root)\nelse:\n with tarfile.open(archive)\
        \ as z:z.extractall(root,filter='data')\nfetch('https://github.com/JetBrains/kotlin/releases/download/v2.4.21/kotlin-compiler-2.4.21.zip',root/'kotlin.zip')\n\
        assert hashlib.sha256((root/'kotlin.zip').read_bytes()).hexdigest()=='7cc140e76daf416a0424a5557f99afd7ca89ebd463ea1101261e3e01c33e75cd'\n\
        with zipfile.ZipFile(root/'kotlin.zip') as z:z.extractall(root)\nfor f in (root/'kotlinc/bin').iterdir():f.chmod(0o755)\n\
        with open(os.environ['GITHUB_PATH'],'a') as f:\n f.write(str(root/('zig-'+arch+'-'+host+'-0.17.0'))+'\\\
        n')\n f.write(str(root/'kotlinc/bin')+'\\n')\nPYSDK\nnpm install --prefix \"$RUNNER_TEMP/ghostnet-sdk\"\
        \ typescript\nnode -e 'require(\"fs\").appendFileSync(process.env.GITHUB_PATH,require(\"path\").join(process.env.RUNNER_TEMP,\"\
        ghostnet-sdk\",\"node_modules\",\".bin\")+\"\\n\")'\n"
    - name: Native language templates (Unix)
      if: runner.os != 'Windows'
      shell: bash
      run: "set -euo pipefail\nfixture=$(mktemp -d)\ntrap 'rm -rf -- \"$fixture\"' EXIT\nexport XDG_STATE_HOME=\"\
        $fixture/state\" BAN_NO_ANIMATION=1\nfor script in ban.sh ban-ru.sh; do\n  bash \"$script\" languages |\
        \ grep TypeScript\n  for kind in c go java javascript typescript csharp bash kotlin dart zig; do\n    project=\"\
        $fixture/$script $kind\"\n    bash \"$script\" init --type \"$kind\" \"$project\"\n    if [[ \"$kind\" ==\
        \ typescript ]]; then (cd \"$project\" && npm install); fi\n    bash \"$script\" inspect \"$project\" |\
        \ grep 'SCAN COMPLETE'\n    bash \"$script\" run --target native \"$project\" > \"$fixture/log\" 2>&1 ||\
        \ { cat \"$fixture/log\"; exit 1; }\n    grep 'Hello GHOSTNET' \"$fixture/log\"\n    if [[ \"$kind\" ==\
        \ csharp ]]; then\n      bash \"$script\" run --mode files \"$project\" > \"$fixture/log\" 2>&1 || { cat\
        \ \"$fixture/log\"; exit 1; }\n      grep 'Hello GHOSTNET' \"$fixture/log\"\n    fi\n    if [[ \"$kind\"\
        \ == go || \"$kind\" == javascript || \"$kind\" == typescript ]]; then bash \"$script\" test \"$project\"\
        ; fi\n  done\n  if [[ \"${RUNNER_OS}\" == Linux ]]; then\n    for kind in ruby php lua; do\n      project=\"\
        $fixture/$script $kind\";bash \"$script\" init --type \"$kind\" \"$project\"\n      bash \"$script\" run\
        \ \"$project\" | grep 'Hello GHOSTNET'\n    done\n  fi\n  if [[ \"${RUNNER_OS}\" == macOS ]]; then\n   \
        \ project=\"$fixture/$script swift\";bash \"$script\" init --type swift \"$project\"\n    bash \"$script\"\
        \ run \"$project\" | grep 'Hello GHOSTNET'\n    bash \"$script\" run --mode files --run-file standalone\
        \ \"$project\" >/dev/null 2>&1 && exit 1 || true\n    printf 'print(\"SWIFT_FILE_OK\")\\n' > \"$project/standalone.swift\"\
        \n    BAN_SOURCE_FILE=\"$project/standalone.swift\" bash \"$script\" run --mode files \"$project\" | grep\
        \ SWIFT_FILE_OK\n  fi\n  bash \"$script\" recent | grep \"$script\"\ndone\n"
    - name: Native language templates (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: "set -euo pipefail\nfixture=$(mktemp -d)\ntrap 'rm -rf -- \"$fixture\"' EXIT\nexport XDG_STATE_HOME=\"\
        $fixture/state\" BAN_NO_ANIMATION=1\nfor script in ban.sh ban-ru.sh; do\n  bash \"$script\" languages |\
        \ grep TypeScript\n  for kind in c go java javascript typescript csharp bash kotlin dart zig; do\n    project=\"\
        $fixture/$script $kind\"\n    bash \"$script\" init --type \"$kind\" \"$project\"\n    if [[ \"$kind\" ==\
        \ typescript ]]; then (cd \"$project\" && npm install); fi\n    bash \"$script\" inspect \"$project\" |\
        \ grep 'SCAN COMPLETE'\n    bash \"$script\" run --target native \"$project\" > \"$fixture/log\" 2>&1 ||\
        \ { cat \"$fixture/log\"; exit 1; }\n    grep 'Hello GHOSTNET' \"$fixture/log\"\n    if [[ \"$kind\" ==\
        \ csharp ]]; then\n      bash \"$script\" run --mode files \"$project\" > \"$fixture/log\" 2>&1 || { cat\
        \ \"$fixture/log\"; exit 1; }\n      grep 'Hello GHOSTNET' \"$fixture/log\"\n    fi\n    if [[ \"$kind\"\
        \ == go || \"$kind\" == javascript || \"$kind\" == typescript ]]; then bash \"$script\" test \"$project\"\
        ; fi\n  done\n  if [[ \"${RUNNER_OS}\" == Linux ]]; then\n    for kind in ruby php lua; do\n      project=\"\
        $fixture/$script $kind\";bash \"$script\" init --type \"$kind\" \"$project\"\n      bash \"$script\" run\
        \ \"$project\" | grep 'Hello GHOSTNET'\n    done\n  fi\n  if [[ \"${RUNNER_OS}\" == macOS ]]; then\n   \
        \ project=\"$fixture/$script swift\";bash \"$script\" init --type swift \"$project\"\n    bash \"$script\"\
        \ run \"$project\" | grep 'Hello GHOSTNET'\n    bash \"$script\" run --mode files --run-file standalone\
        \ \"$project\" >/dev/null 2>&1 && exit 1 || true\n    printf 'print(\"SWIFT_FILE_OK\")\\n' > \"$project/standalone.swift\"\
        \n    BAN_SOURCE_FILE=\"$project/standalone.swift\" bash \"$script\" run --mode files \"$project\" | grep\
        \ SWIFT_FILE_OK\n  fi\n  bash \"$script\" recent | grep \"$script\"\ndone\n"
    - name: Maven, Gradle and Zig project engines
      if: runner.os == 'Linux'
      shell: bash
      run: "python3 - <<'PYPROJECT'\nimport os,pathlib,subprocess,tempfile\nroot=pathlib.Path.cwd();env=dict(os.environ,BAN_NO_ANIMATION='1')\n\
        with tempfile.TemporaryDirectory(prefix='ghostnet engines ') as folder:\n p=pathlib.Path(folder);env['XDG_STATE_HOME']=str(p/'state')\n\
        \ def call(script,*args):\n  r=subprocess.run(['bash',str(root/script),*map(str,args)],env=env,text=True,capture_output=True,timeout=300)\n\
        \  print(r.stdout+r.stderr);assert r.returncode==0\n  return r.stdout+r.stderr\n # Maven builds a real executable\
        \ JAR, launched by GHOSTNET.\n m=p/'maven';(m/'src/main/java').mkdir(parents=True)\n (m/'src/main/java/Main.java').write_text('public\
        \ class Main { public static void main(String[] a){System.out.println(\"MAVEN_OK\");}}')\n (m/'pom.xml').write_text('<project\
        \ xmlns=\"http://maven.apache.org/POM/4.0.0\"><modelVersion>4.0.0</modelVersion><groupId>demo</groupId><artifactId>app</artifactId><version>1.0</version><properties><maven.compiler.source>17</maven.compiler.source><maven.compiler.target>17</maven.compiler.target></properties><build><plugins><plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-jar-plugin</artifactId><version>3.4.2</version><configuration><archive><manifest><mainClass>Main</mainClass></manifest></archive></configuration></plugin></plugins></build></project>')\n\
        \ g=p/'gradle';(g/'src/main/java').mkdir(parents=True)\n (g/'src/main/java/Main.java').write_text('public\
        \ class Main {public static void main(String[] a){System.out.println(\"GRADLE_OK\");}}')\n (g/'settings.gradle').write_text(\"\
        rootProject.name='demo'\")\n (g/'build.gradle').write_text(\"plugins { id 'java' }; jar { manifest { attributes\
        \ 'Main-Class': 'Main' } }\")\n z=p/'zig';z.mkdir()\n subprocess.run(['zig','init'],cwd=z,check=True,env=env)\n\
        \ (z/'src/main.zig').write_text('const std=@import(\"std\"); pub fn main() void {std.debug.print(\"ZIG_PROJECT_OK\"\
        , .{});}')\n for script in ('ban.sh','ban-ru.sh'):\n  assert 'MAVEN_OK' in call(script,'run','--run-file','target/app-1.0.jar',m)\n\
        \  call(script,'test',m)\n  assert 'GRADLE_OK' in call(script,'run','--run-file','build/libs/demo.jar',g)\n\
        \  call(script,'test',g)\n  assert 'ZIG_PROJECT_OK' in call(script,'run',z)\n  call(script,'test',z)\nPYPROJECT\n"
    - name: Source preservation and original terminal contract
      if: runner.os != 'Windows'
      shell: bash
      run: "python3 - <<'PYCONTRACT'\nimport os,pathlib,platform,pty,select,subprocess,tempfile,time\nroot=pathlib.Path.cwd()\n\
        with tempfile.TemporaryDirectory(prefix='ghostnet contracts ') as folder:\n base=pathlib.Path(folder);env=dict(os.environ,BAN_NO_ANIMATION='1',HOME=str(base/'home'),XDG_STATE_HOME=str(base/'state'))\n\
        \ host='macos' if platform.system()=='Darwin' else 'linux'\n for script in ('ban.sh','ban-ru.sh'):\n  for\
        \ language,source,output,code in [('java','Main.java','Main.class','public class Main {}'),('typescript','main.ts','main.js','const\
        \ value: string = \"KEEP\";')]:\n   project=base/(script+' '+language);project.mkdir();original=project/source;original.write_text(code)\n\
        \   generated=project/'.ghostnet-build'/host/language/'0';generated.mkdir(parents=True)\n   os.link(original,generated/output)\n\
        \   r=subprocess.run(['bash',str(root/script),'build',str(project)],env=env,capture_output=True,text=True)\n\
        \   assert r.returncode!=0,(r.stdout+r.stderr)\n   assert original.read_text()==code\n  target=base/(script+'\
        \ keep');target.mkdir();(target/'keep.txt').write_text('KEEP')\n  r=subprocess.run(['bash',str(root/script),'init','--type','cpp',str(target)],env=env,capture_output=True)\n\
        \  assert r.returncode!=0 and (target/'keep.txt').read_text()=='KEEP'\n  master,slave=pty.openpty();p=subprocess.Popen(['bash',str(root/script)],env=dict(env,BAN_NO_ANIMATION='0',TERM='xterm-256color'),stdin=slave,stdout=slave,stderr=slave);os.close(slave)\n\
        \  data=b'';marker=b'Exit' if script=='ban.sh' else 'Выход'.encode();deadline=time.monotonic()+15\n  try:\n\
        \   while marker not in data:\n    assert time.monotonic()<deadline,data.decode(errors='replace')\n    if\
        \ select.select([master],[],[],.1)[0]:data+=os.read(master,65536)\n   assert b'SYSTEM ONLINE' in data and\
        \ b'Loading:' in data\n   assert b'\\x1b[38;2;0;255;65m' in data\n   os.write(master,b'\\x1b[B\\x1b[B\\\
        r')\n   # Drain redraws: macOS PTY buffers can fill while waiting for exit.\n   deadline=time.monotonic()+15\n\
        \   while p.poll() is None:\n    assert time.monotonic()<deadline,data.decode(errors='replace')\n    if\
        \ select.select([master],[],[],.1)[0]:\n     try:data+=os.read(master,65536)\n     except OSError:break\n\
        \   assert p.wait(timeout=2)==0\n  finally:\n   if p.poll() is None:p.kill();p.wait()\n   os.close(master)\n\
        print('PASS: source hardlink preservation, non-overwrite init, original animated menu and exit navigation')\n\
